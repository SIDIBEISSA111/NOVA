# Déploiement Netlify : `npm run build` produit le dossier dist/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Les fichiers de dist/assets ont un nom unique (empreinte) : cache d'un an
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
